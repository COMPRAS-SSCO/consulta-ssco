name: Actualizar lista SSCO

on:
  schedule:
    # 12:00 m. hora de Lima (17:00 UTC). Corre del 28 al 31 y el paso "check"
    # deja pasar solo el ÚLTIMO día calendario del mes.
    - cron: "0 17 28-31 * *"
    # Respaldo: día 1 a las 12:00 m. por si SUNAT publicó después del mediodía.
    - cron: "0 17 1 * *"
    # Cada lunes 12:00 m.: refresca el padrón reducido (razón social, estado y condición).
    - cron: "0 17 * * 1"
  workflow_dispatch:   # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        name: Verificar si hoy es el último día del mes (hora Lima)
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          HOY=$(TZ=America/Lima date +%d)
          MANANA=$(TZ=America/Lima date -d tomorrow +%d)
          DIA=$(TZ=America/Lima date +%u)
          if [ "$MANANA" = "01" ] || [ "$HOY" = "01" ] || [ "$DIA" = "1" ]; then R=true; else R=false; fi
          echo "Hoy: $HOY  ->  actualizar: $R"
          echo "run=$R" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pillow && mkdir -p data
      - name: Recuperar padrón guardado
        uses: actions/cache/restore@v4
        with:
          path: padron
          key: padron-${{ github.run_id }}
          restore-keys: padron-
      - name: Descargar padrón reducido del RUC (SUNAT)
        run: |
          curl -L --fail --retry 3 --retry-delay 20 --max-time 1800 -A "Mozilla/5.0" \
            -o padron.zip http://www2.sunat.gob.pe/padron_reducido_ruc.zip \
            || { echo "AVISO: no se pudo descargar el padrón"; rm -f padron.zip; }
          ls -la padron.zip || true
      - name: Recuperar Padrón RUC (actividad económica) guardado
        uses: actions/cache/restore@v4
        with:
          path: padronruc
          key: padronruc-${{ github.run_id }}
          restore-keys: padronruc-
      - name: Descargar Padrón RUC de datos abiertos (actividad económica, mensual)
        id: da
        run: |
          mkdir -p padronruc
          HAVE=$(cat padronruc/mes.txt 2>/dev/null || echo ninguno)
          for i in 0 1 2 3 4; do
            M=$(date -d "$(date +%Y-%m-15) -$i month" +%Y%m)
            URL="https://www.datosabiertos.gob.pe/sites/default/files/PadronRUC_$M.zip"
            if curl -sfL -A "Mozilla/5.0" -r 0-0 --max-time 60 -o /dev/null "$URL"; then
              echo "Último Padrón RUC publicado: $M (guardado: $HAVE)"
              if [ "$M" != "$HAVE" ]; then
                curl -fL --retry 3 --retry-delay 20 -A "Mozilla/5.0" --max-time 1800 -o padronruc/PadronRUC.zip "$URL" \
                  && echo "$M" > padronruc/mes.txt \
                  || echo "AVISO: no se pudo descargar el Padrón RUC $M"
              fi
              break
            fi
          done
          ls -la padronruc || true
          echo "mes=$(cat padronruc/mes.txt 2>/dev/null || echo ninguno)" >> "$GITHUB_OUTPUT"
      - run: python build.py
      - name: Guardar Padrón RUC (actividad económica)
        if: steps.da.outputs.mes != 'ninguno'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: padronruc
          key: padronruc-${{ steps.da.outputs.mes }}
      - name: Guardar padrón para la próxima vez
        if: hashFiles('padron/fecha.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: padron
          key: padron-${{ github.run_id }}
      - name: Guardar el Excel nuevo en el repositorio
        run: |
          git config user.name "actualizador-ssco"
          git config user.email "actions@users.noreply.github.com"
          git add data/ssco.xlsx
          git diff --cached --quiet || git commit -m "Lista SSCO actualizada $(date +%Y-%m-%d)"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
